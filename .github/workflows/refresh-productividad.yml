name: Refresh Productividad

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mes opcional YYYY-MM. Vacío = mes actual hasta hoy."
        required: false
        default: ""
      skip_fetch:
        description: "Usar ReportTareas.xlsx existente en el repo, sin consultar W4W."
        required: false
        default: "false"
  schedule:
    # GitHub Actions usa UTC; cada 10 minutos se refresca el mes actual.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-productividad
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DINET_W4W_COOKIE: ${{ secrets.DINET_W4W_COOKIE }}
      DINET_USER: ${{ secrets.DINET_USER }}
      DINET_PASSWORD: ${{ secrets.DINET_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r productividad_pipeline/requirements.txt

      - name: Renew W4W session
        if: ${{ env.DINET_USER != '' && env.DINET_PASSWORD != '' }}
        run: |
          python -m playwright install --with-deps chromium
          python productividad_pipeline/refresh_w4w_session.py --out "$RUNNER_TEMP/dinet_cookie.txt"
          {
            echo "DINET_W4W_COOKIE=$(cat \"$RUNNER_TEMP/dinet_cookie.txt\")"
            echo "DINET_USER="
            echo "DINET_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Refresh productivity data
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.month }}" != "" ]; then
            ARGS="$ARGS --month ${{ github.event.inputs.month }}"
          fi
          if [ "${{ github.event.inputs.skip_fetch }}" = "true" ]; then
            ARGS="$ARGS --skip-fetch"
          fi
          python productividad_pipeline/refresh_productividad_online.py $ARGS

      - name: Archive productivity in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secretos de Supabase no configurados; se omite el archivo historico."
            exit 0
          fi
          python productividad_pipeline/publish_productividad_supabase.py --json productividad_pipeline/dash_data.json

      - name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productividad/dash_data.json
          if git diff --cached --quiet; then
            echo "No hay cambios en dash_data.json"
            exit 0
          fi
          git commit -m "Refresca productividad W4W"
          git push
