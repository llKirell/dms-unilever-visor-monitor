<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WareTrack — Productividad Picking Unilever/KCC</title>
<style>
:root{
  --accent:#1f6feb; --accent-2:#2da44e; --warn:#d4a72c; --bad:#cf222e; --goal:#c026d3;
  --bg:#f6f8fa; --panel:#ffffff; --panel-2:#f0f3f6; --ink:#1f2328;
  --muted:#656d76; --line:#d0d7de; --shadow:0 1px 3px rgba(31,35,40,.08),0 8px 24px rgba(31,35,40,.06);
  --chart-grid:#e6ebf1;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c2330; --ink:#e6edf3;
  --muted:#8b949e; --line:#30363d; --shadow:0 1px 3px rgba(1,4,9,.4),0 8px 24px rgba(1,4,9,.5);
  --accent:#4493f8; --accent-2:#3fb950; --warn:#d29922; --bad:#f85149; --chart-grid:#21262d; --goal:#e24ff0;
}}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c2330; --ink:#e6edf3;
  --muted:#8b949e; --line:#30363d; --shadow:0 1px 3px rgba(1,4,9,.4),0 8px 24px rgba(1,4,9,.5);
  --accent:#4493f8; --accent-2:#3fb950; --warn:#d29922; --bad:#f85149; --chart-grid:#21262d; --goal:#e24ff0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
/* tablero de pantalla completa (TV): llena el viewport, sin scroll global */
.wrap{width:100vw;height:100vh;padding:clamp(10px,1.4vh,20px) clamp(14px,1.6vw,34px);
  display:grid;grid-template-rows:auto 1fr;gap:clamp(8px,1.1vh,14px);overflow:hidden}
header.app{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);flex-wrap:nowrap;min-height:0}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:clamp(34px,2.6vw,52px);height:clamp(34px,2.6vw,52px);border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(17px,1.5vw,26px)}
.logo h1{font-size:clamp(17px,1.35vw,24px);margin:0;letter-spacing:.3px}
.header-filters{display:flex;align-items:center;gap:6px;min-width:0}
.header-filters label{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.35px}
.header-filters select{min-width:0;width:clamp(84px,8vw,132px);padding:6px 7px;font-size:11px}
.period-control{display:flex;align-items:center;gap:6px;white-space:nowrap}
.period-control span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.35px}
.period-control .seg button{padding:6px 10px;font-size:11px}
.header-filters .is-hidden{display:none}
.logo .sub{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.spacer{flex:1}
.rango{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.5}
.theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;
  padding:7px 10px;cursor:pointer;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.chip b{color:var(--ink)}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:8px 10px;font-size:13.5px;min-width:150px;font-weight:600}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:clamp(6px,.9vh,10px) clamp(10px,1vw,18px);font-size:clamp(12px,.95vw,16px);cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.grid-kpi{display:grid;grid-template-columns:1fr;gap:12px;min-height:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(10px,1.4vh,18px) clamp(14px,1.2vw,20px);box-shadow:var(--shadow)}
.kpi .k{font-size:clamp(10px,.72vw,13px);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.05;margin-top:4px}
.kpi .u{font-size:clamp(9px,.68vw,12px);color:var(--muted);font-weight:600}
.kpi.hero{border-left:5px solid var(--accent);display:flex;flex-direction:column;justify-content:center;padding:clamp(8px,1.3vh,16px) clamp(12px,1.1vw,18px);height:100%}
.kpi.hero .k{font-size:clamp(9px,.65vw,12px)}
.kpi.hero .v{font-size:clamp(24px,2.6vw,42px)}
.kpi.hero.status-green{border-left-color:var(--accent-2)}
.kpi.hero.status-yellow{border-left-color:var(--warn)}
.kpi.hero.status-red{border-left-color:var(--bad)}
.goal{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:clamp(6px,.8vh,10px);padding-top:clamp(5px,.7vh,8px);border-top:1px solid var(--line);font-size:clamp(9px,.68vw,12px);font-weight:700;color:var(--muted)}
.goal b{font-size:clamp(12px,.9vw,16px);color:var(--ink)}
.goal .goal-state{border-radius:999px;padding:2px 7px;font-size:clamp(8px,.62vw,11px);font-weight:800}
.goal.green .goal-state{color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 16%,transparent)}
.goal.yellow .goal-state{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.goal.red .goal-state{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.goal.neutral .goal-state{color:var(--muted);background:var(--panel-2)}
/* === LAYOUT: izquierda (banda + tendencia) | derecha (ranking a toda altura) === */
.layout{display:grid;grid-template-columns:1fr clamp(340px,34vw,640px);gap:clamp(8px,1vw,16px);min-height:0}
.left{display:grid;grid-template-rows:auto 1fr;gap:clamp(6px,.8vh,10px);min-height:0}
.topband{display:flex;gap:clamp(7px,.8vw,13px);align-items:stretch;min-height:0}
.turno-mini{display:flex;flex-direction:column;gap:clamp(5px,.6vh,9px);flex:0 0 auto}
/* banda superior = 3 columnas de igual altura (la del texto) */
.prodcard{flex:1.5 1 0;min-width:clamp(220px,22vw,380px)}
.mixcard{flex:1 1 0;min-width:clamp(150px,13vw,230px)}
.famcard{flex:1 1 0;min-width:clamp(160px,14vw,250px)}
/* las 4 tarjetas de productividad en grilla 2x2 del mismo tamaño dentro de prodcard */
.prodcard>.prod-2x2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(5px,.6vw,10px);padding:clamp(5px,.7vh,10px);flex:1;min-height:0}
.prod-2x2 .grid-kpi{display:flex;min-height:0}
.prod-2x2 .grid-kpi>.kpi{flex:1;width:100%}
.prod-2x2 .turno-mini{display:contents}
/* valor + delta en la MISMA linea (el delta no cambia la altura al pasar de Dia a Mes) */
.prod-2x2 .vrow{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-height:0}
.prod-2x2 .vrow .vs{margin:0}
.prod-2x2 .kpi,.prod-2x2 .mini{height:100%;margin:0;min-height:0;border-radius:9px;padding:clamp(4px,.6vh,9px) clamp(7px,.7vw,12px);justify-content:center}
.prod-2x2 .kpi.hero{border-left-width:4px;padding:clamp(4px,.6vh,9px) clamp(7px,.7vw,12px)}
.prod-2x2 .kpi.hero .v{font-size:clamp(15px,1.5vw,24px)}
.prod-2x2 .kpi.hero .k{font-size:clamp(8px,.6vw,11px)}
.prod-2x2 .kpi.hero .goal{margin-top:3px;padding-top:3px}
.prod-2x2 .kpi.hero .goal .goal-state,.prod-2x2 .kpi.hero .vslab{display:none}
.prod-2x2 .mini .mv{font-size:clamp(14px,1.4vw,22px)}
/* participacion por familia sin barras: solo nombre + % */
.famlist{display:flex;flex-direction:column;gap:clamp(3px,.6vh,8px);height:100%;justify-content:center}
.frow{display:flex;align-items:center;gap:8px}
.frow .fdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.frow .fnm{flex:1;font-size:clamp(11px,.9vw,15px);font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fpc{font-size:clamp(12px,1vw,17px);font-weight:800;color:var(--accent)}
/* Perfil de Pedidos: dona (Caja azul / Pallet ambar) + leyenda */
.perfil-donut{display:flex;align-items:center;gap:clamp(8px,1vw,16px);height:100%;justify-content:center}
.donut{width:clamp(66px,6vw,96px);height:clamp(66px,6vw,96px);flex:0 0 auto}
.perfil-leg{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px)}
.perfil-leg .lg{display:flex;align-items:center;gap:7px}
.perfil-leg .lg .d{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.perfil-leg .lg .n{font-size:clamp(11px,.85vw,15px);color:var(--muted);font-weight:700}
.perfil-leg .lg .v{font-size:clamp(13px,1.1vw,18px);font-weight:800;color:var(--ink);margin-left:auto;padding-left:10px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(5px,.8vh,11px) clamp(9px,.8vw,15px);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;border-left:4px solid var(--accent);flex:1}
.mini.on{outline:2px solid var(--accent);outline-offset:-1px}
.mini:nth-child(2){border-left-color:var(--accent-2)}
.mini:nth-child(3){border-left-color:var(--warn)}
.mini .mk2{font-size:clamp(8px,.6vw,11px);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.mini .mv{font-size:clamp(14px,1.4vw,22px);font-weight:800;line-height:1.05;margin-top:1px}
.mini.status-green .mv{color:var(--accent-2)} .mini.status-yellow .mv{color:var(--warn)} .mini.status-red .mv{color:var(--bad)}
.mini-goal{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;padding-top:3px;border-top:2px dashed var(--accent-2);font-size:clamp(8px,.6vw,10px);font-weight:800;color:var(--muted)}
.mini-goal b{font-size:clamp(9px,.68vw,12px);color:var(--accent-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.card.ranking{height:100%}
.card.trend .body,.card.compact .body{flex:1;min-height:0}
.card.trend .body{padding:4px 12px 8px}
.card.trend svg{width:100%;height:100%}
.card.compact .body{padding:4px 12px 7px;overflow-y:auto}
.card h2{font-size:clamp(10px,.78vw,13px);margin:0;padding:clamp(4px,.6vh,8px) 14px 0;letter-spacing:.2px}
.card .hint{font-size:clamp(9px,.7vw,12px);color:var(--muted);padding:1px 14px 0}
.card .body{padding:12px 14px}
/* columna de ranking (turno activo / manual / top 15) */
.card.ranking{display:flex;flex-direction:column;min-height:0}
.rank-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:clamp(10px,1.3vh,16px) clamp(14px,1.2vw,20px) clamp(6px,.8vh,10px)}
.rank-ttl{display:flex;flex-direction:column;min-width:0}
.rank-ttl #rank-turno{font-size:clamp(14px,1.25vw,22px);font-weight:800;line-height:1.05}
.rank-ttl .rank-sub{font-size:clamp(10px,.75vw,13px);color:var(--muted);font-weight:600;margin-top:2px}
.rank-tn{text-align:right;line-height:1.05;white-space:nowrap}
.rank-tn b{display:block;font-size:clamp(15px,1.4vw,24px);font-weight:800;color:var(--accent-2)}
.rank-tn span{font-size:clamp(9px,.68vw,12px);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rank-ctrl{margin:0 clamp(14px,1.2vw,20px) clamp(6px,.8vh,10px);align-self:flex-start}
.rank-ctrl button{padding:clamp(4px,.6vh,8px) clamp(8px,.8vw,14px);font-size:clamp(10px,.78vw,13px)}
.rank-columns{display:grid;grid-template-columns:clamp(18px,1.3vw,26px) 1fr clamp(48px,3.6vw,74px) clamp(40px,3vw,58px);gap:9px;align-items:end;margin:0 clamp(10px,1vw,16px);padding:0 0 3px;color:var(--muted);font-size:clamp(8px,.62vw,11px);font-weight:800;text-transform:uppercase;letter-spacing:.35px}
.rank-columns .prod,.rank-columns .hrs{text-align:right}
.rank-list{flex:1;min-height:0;overflow-y:auto;padding:4px clamp(10px,1vw,16px) clamp(8px,1vh,12px)}
.rank-list::-webkit-scrollbar{width:9px}
.rank-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
/* filas del ranking (columna derecha): mas grandes, legibles de lejos */
.rank-list .ranklist{gap:clamp(5px,.75vh,11px)}
.rank-list .rankrow{grid-template-columns:clamp(18px,1.3vw,26px) 1fr clamp(48px,3.6vw,74px) clamp(40px,3vw,58px);gap:9px;font-size:clamp(10px,.8vw,14px)}
.rank-list .rankrow .mid .nm2{font-size:clamp(10px,.8vw,14px)}
.rank-list .rankrow .mid .track{height:clamp(6px,.8vh,11px)}
.rank-list .rankrow .vv{font-size:clamp(11px,.9vw,15px)}
.rank-list .rankrow .hh{font-size:clamp(10px,.76vw,13px)}
.rank-list .rankrow .hh.strong{color:var(--ink);font-weight:800}
.rank-list .rankrow .rk{font-size:clamp(10px,.75vw,13px)}
.empty{padding:22px 14px;color:var(--muted);text-align:center;font-size:clamp(12px,.9vw,15px)}
/* barras de participacion (mix y familia) */
.pbar{margin-bottom:clamp(5px,.8vh,10px)}
.pbar .lab{display:flex;justify-content:space-between;font-size:clamp(9px,.7vw,12px);font-weight:700;margin-bottom:3px}
.pbar .lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .lab .pc{color:var(--muted)}
.pbar .trk{height:clamp(8px,1vh,14px);background:var(--panel-2);border-radius:999px;overflow:hidden}
.pbar .fl{height:100%;border-radius:999px;background:var(--accent)}
.pbar.c .fl{background:var(--accent)} .pbar.p .fl{background:var(--warn)}
.fam0 .fl{background:#1f6feb}.fam1 .fl{background:#2da44e}.fam2 .fl{background:#8250df}
.fam3 .fl{background:#d4a72c}.fam4 .fl{background:#1aa3c2}.fam5 .fl{background:#bc4c00}
.mixtot{font-size:clamp(9px,.72vw,12px);color:var(--muted);font-weight:700;margin-top:4px}
.mixtot b{color:var(--ink)}
/* variacion vs mes anterior (en KPI y mini-tarjetas) */
.vs{display:flex;align-items:center;gap:5px;margin-top:5px}
.mini .vs{margin-top:3px}
.delta{font-size:clamp(9px,.72vw,13px);font-weight:800;border-radius:999px;padding:1px 7px;white-space:nowrap}
.delta.up{color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 16%,transparent)}
.delta.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.delta.flat{color:var(--muted);background:var(--panel-2)}
.vslab{font-size:clamp(8px,.6vw,11px);color:var(--muted);font-weight:600}
/* Perfil de Pedidos (tarjeta caja/pallet estilo nota) */
.card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:clamp(6px,.9vh,12px) 14px 0}
.card-hd h2{padding:0}
.per{font-size:clamp(10px,.8vw,14px);font-weight:800;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.perfil{display:flex;flex-direction:column;gap:clamp(4px,.7vh,9px);height:100%;justify-content:center}
.prow{display:flex;align-items:baseline;justify-content:space-between}
.prow .pl{font-size:clamp(13px,1.1vw,19px);font-weight:800;color:var(--ink)}
.prow .pv{font-size:clamp(16px,1.6vw,28px);font-weight:800;color:var(--accent)}
.ptrk{height:clamp(7px,.9vh,13px);background:var(--panel-2);border-radius:999px;overflow:hidden}
.pfl{height:100%;border-radius:999px}
.pfl.c{background:var(--accent)} .pfl.p{background:var(--warn)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.method{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel-2)}
.method .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.method .big{font-size:26px;font-weight:800;margin-top:4px}
.method .ds{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.method.j{border-top:3px solid var(--warn)} .method.d{border-top:3px solid var(--accent)}
.method.e{border-top:3px solid var(--accent-2)}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
th.num,td.num{text-align:right}
tbody tr:hover{background:var(--panel-2)}
.bar{position:relative}
.bar::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:var(--w,0);
  background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;z-index:0}
.bar span{position:relative;z-index:1;font-weight:700}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
.badge.ok{background:color-mix(in srgb,var(--accent-2) 18%,transparent);color:var(--accent-2)}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.section-h{font-size:15px;margin:0 0 2px;letter-spacing:.3px}
.turno-panels{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1vw,14px);min-height:0}
.turno-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.turno-card .thead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:clamp(8px,1.1vh,14px) clamp(12px,1vw,18px);border-bottom:1px solid var(--line)}
.turno-card .thead .tt{font-size:clamp(12px,.9vw,16px);font-weight:800;letter-spacing:.3px}
.turno-card .thead .hh{font-size:clamp(10px,.75vw,13px);color:var(--muted);font-weight:600}
.turno-card .thead .tn{text-align:right;line-height:1.05}
.turno-card .thead .tn b{font-size:clamp(15px,1.25vw,22px);font-weight:800;color:var(--accent-2);display:block}
.turno-card .thead .tn span{font-size:clamp(9px,.65vw,12px);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.turno-card .tbody{padding:6px 8px 8px;overflow-y:auto;min-height:0;flex:1}
.turno-card .tbody::-webkit-scrollbar{width:8px}
.turno-card .tbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.turno-card .empty{padding:18px 12px;color:var(--muted);font-size:12.5px;text-align:center}
.ranklist{display:grid;gap:clamp(5px,.7vh,10px)}
.rankrow{display:grid;grid-template-columns:clamp(16px,1.2vw,22px) 1fr clamp(44px,3.4vw,66px);align-items:center;gap:7px;font-size:clamp(10px,.72vw,13px)}
.rankrow .rk{color:var(--muted);font-weight:700;text-align:center}
.rankrow .mid{min-width:0}

function normalizeCells(data){
  return (data?.celdas||[]).map(c=>({
  usuario:c.usuario, dia:c.dia, turno:c.turno||"SIN TURNO", cargo:c.cargo||"",
  horas:+c.horas||0, tareas:+c.tareas||0, cajas:+c.cajas||0,
  cajas_sueltas:+c.cajas_sueltas||0, pallets:+c.pallets||0,
  unidades_productivas: c.unidades_productivas==null ? ((+c.cajas_sueltas||0)+(+c.pallets||0)) : (+c.unidades_productivas||0),
  volumen_m3:+c.volumen_m3||0, peso_tn:+c.peso_tn||0,
  ubicaciones:+c.ubicaciones||0, detalle:+c.detalle||0,
  t_std_min:+c.t_std_min||0, t_real_min:+c.t_real_min||0
}));
}
function normalizeFamilias(data){
  return (data?.familias||[]).map(row=>({
    dia:row.dia, turno:row.turno||"SIN TURNO", familia:row.familia||"(SIN FAMILIA)",
    cajas_sueltas:+row.cajas_sueltas||0, cajas:+row.cajas||0
  }));
}
function normalizeObjetivos(data){
  return (data?.objetivos||[]).map(row=>({
    metrica:row.metrica, turno:String(row.turno||"TODOS").toUpperCase(),
    objetivo:+row.objetivo||0, amarillo_min:+row.amarillo_min||0,
    verde_min:+row.verde_min||(+row.objetivo||0)
  }));
}
// Selector de métricas operativas normalizadas y de volumen.
const METRICS = [
  {key:"unidades_productivas", label:"Unidades/h", unit:"unidades/h", num:"unidades_productivas", dec:1},
  {key:"volumen_m3", label:"m³/h", unit:"m³/h", num:"volumen_m3", dec:2},
  {key:"peso_tn", label:"Tn/h", unit:"Tn/h", num:"peso_tn", dec:2},
  {key:"ubicaciones", label:"Ubic/h", unit:"ubic/h", num:"ubicaciones", dec:1},
  {key:"tareas", label:"Tareas/h", unit:"tareas/h", num:"tareas", dec:2},
];
const EFIC = {key:"efic"};  // métrica siempre visible como KPI (no en el selector)
// rankMode: "auto" (turno por hora) | "1° TURNO" | "2° TURNO" | "3° TURNO" | "top15"
let state = {period:"mes", mes:"", dia:"__ALL__", turno:"__ALL__", metric:"unidades_productivas", rankMode:"auto"};

// hora de LIMA (America/Lima, UTC-5) sin depender del reloj/zona del equipo
function limaHour(){
  try{
    const s=new Intl.DateTimeFormat("en-US",{timeZone:"America/Lima",hour:"numeric",hour12:false}).format(new Date());
    let h=parseInt(s,10); return (h===24?0:h);
  }catch(e){ return new Date().getHours(); }
}
function turnoActual(){
  const h=limaHour();
  if(h>=7&&h<15) return "1° TURNO";
  if(h>=15&&h<23) return "2° TURNO";
  return "3° TURNO";
}
const TURNO_HORARIO={"1° TURNO":"07:00 – 15:00","2° TURNO":"15:00 – 23:00","3° TURNO":"23:00 – 07:00"};

const fmt=(v,d=1)=>Number(v||0).toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const metricDef=()=>METRICS.find(m=>m.key===state.metric);
function rateOf(rows, m){
  if(m.key==="efic"){const ts=rows.reduce((a,r)=>a+r.t_std_min,0),tr=rows.reduce((a,r)=>a+r.t_real_min,0);return tr>0?ts/tr*100:0;}
  const num=rows.reduce((a,r)=>a+r[m.num],0),h=rows.reduce((a,r)=>a+r.horas,0);return h>0?num/h:0;
}
function targetFor(metricKey){
  return OBJETIVOS.find(row=>row.metrica===metricKey&&row.turno==="TODOS")
    || OBJETIVOS.find(row=>row.metrica===metricKey)
    || null;
}
function semaforo(value, target, hasData=true){
  if(!hasData)return {key:"neutral",label:"Sin datos"};
  if(!target||!target.objetivo)return {key:"neutral",label:"Meta no disponible"};
  if(value>=target.verde_min)return {key:"green",label:"En meta"};
  if(value>=target.amarillo_min)return {key:"yellow",label:"En observación"};
  return {key:"red",label:"Bajo meta"};
}
function semaforoColor(status){
  return status.key==="green"?"var(--accent-2)":status.key==="yellow"?"var(--warn)":status.key==="red"?"var(--bad)":"var(--muted)";
}
function filtered(){
  const dia=state.period==="dia"?state.dia:"__ALL__";
  return CUR.filter(r=>(dia==="__ALL__"||r.dia===dia)
    && (state.turno==="__ALL__"||r.turno===state.turno));
}
function trendFiltered(){
  return CUR.filter(r=>state.turno==="__ALL__"||r.turno===state.turno);
}
function groupBy(rows, key){const m=new Map();for(const r of rows){if(!m.has(r[key]))m.set(r[key],[]);m.get(r[key]).push(r);}return m;}

function renderControls(){
  const el=document.getElementById("f-metric");
  el.innerHTML=METRICS.map(m=>`<button data-k="${m.key}" class="${m.key===state.metric?'on':''}">${m.label}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    state.metric=b.dataset.k;
    el.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x.dataset.k===state.metric));
    renderAll();};
}
function renderPeriod(){
  const el=document.getElementById("f-period");
  el.innerHTML=[["dia","Día"],["mes","Mes"]].map(([key,label])=>
    `<button data-period="${key}" class="${state.period===key?'on':''}">${label}</button>`).join("");
  el.onclick=e=>{const button=e.target.closest("button[data-period]");if(!button)return;
    state.period=button.dataset.period;
    renderFilters();renderPeriod();renderAll();};
}
function renderFilters(){
  const el=document.getElementById("f-filters");
  const monthOptions=MONTHS.slice().reverse().map(month=>`<option value="${month}" ${month===state.mes?'selected':''}>${mesLabel(month)}</option>`).join("");
  const days=[...new Set(CUR.map(r=>r.dia).filter(Boolean))].sort();
  if(state.period==="dia"&&(state.dia==="__ALL__"||!days.includes(state.dia))) state.dia=days[days.length-1]||"__ALL__";
  if(state.period!=="dia"&&state.dia!=="__ALL__"&&!days.includes(state.dia)) state.dia="__ALL__";
  const dayOptions=days.map(day=>`<option value="${day}" ${day===state.dia?'selected':''}>${day.split("-").reverse().join("/")}</option>`).join("");
  const turns=["1° TURNO","2° TURNO","3° TURNO","SIN TURNO"];
  const turnOptions=turns.filter(turn=>CUR.some(r=>r.turno===turn)).map(turn=>`<option value="${turn}" ${turn===state.turno?'selected':''}>${turn}</option>`).join("");
  el.innerHTML=`<label>Mes<select data-filter="mes">${monthOptions}</select></label><label class="${state.period==='dia'?'':'is-hidden'}">Día<select data-filter="dia">${dayOptions}</select></label><label>Turno<select data-filter="turno"><option value="__ALL__">Todos</option>${turnOptions}</select></label>`;
  el.onchange=e=>{const select=e.target.closest("select[data-filter]");if(!select)return;
    state[select.dataset.filter]=select.value;
    if(select.dataset.filter==="mes"){state.dia="__ALL__";rebuildFromData();}
    renderFilters();renderAll();};
}
function renderKpis(){
  const m=metricDef();
  const rows=filtered();
  const main=rateOf(rows,m);
  const target=targetFor(m.key);
  const status=semaforo(main,target,rows.length>0);
  const badge=state.period==="mes"&&state.turno==="__ALL__"?deltaBadge(main, rateOf(PREV,m)):"";
  document.getElementById("kpis").innerHTML=
    `<div class="kpi hero status-${status.key}"><div class="k">${m.label}</div>`+
    `<div class="vrow"><div class="v">${fmt(main,m.dec)}</div>${badge?`<span class="vs">${badge}</span>`:``}</div>`+
    `<div class="goal ${status.key}"><span>Objetivo</span><b>${target?fmt(target.objetivo,m.dec):"—"}</b><span class="goal-state">${status.label}</span></div></div>`;
}
// mini tarjetas por turno — resalta el turno activo (o el seleccionado) + delta vs mes anterior
function renderTurnoMini(){
  const m=metricDef();
  const turnos=["1° TURNO","2° TURNO","3° TURNO"];
  const base=filtered();
  const foco=state.turno!=="__ALL__"?state.turno:(state.rankMode==="auto"?turnoActual():(state.rankMode==="top15"?turnoActual():state.rankMode));
  const target=targetFor(m.key);
  const html=turnos.map(t=>{
    const rows=base.filter(r=>r.turno===t);
    const v=rateOf(rows,m);
    const status=semaforo(v,target,rows.length>0);
    const badge=state.period==="mes"?deltaBadge(v, rateOf(PREV.filter(r=>r.turno===t),m)):"";
    return `<div class="mini status-${status.key} ${t===foco?'on':''}"><div class="mk2">${t}</div>`+
           `<div class="vrow"><div class="mv">${fmt(v,m.dec)}</div>${badge?`<span class="vs">${badge}</span>`:``}</div>`+
           (target?`<div class="mini-goal"><span>Objetivo</span><b>${fmt(target.objetivo,m.dec)}</b></div>`:``)+`</div>`;
  }).join("");
  document.getElementById("turno-mini").innerHTML=html;
}
// Perfil de Pedidos: participacion caja vs pallet — dona (Caja azul / Pallet ambar) + leyenda
function donutMix(pc){
  const C=213.628, caja=Math.max(0,Math.min(100,pc))/100*C, pal=C-caja;
  return `<svg class="donut" viewBox="0 0 90 90" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Caja ${fmt(pc,0)}%">
    <circle cx="45" cy="45" r="34" fill="none" stroke="var(--panel-2)" stroke-width="13"/>
    <g transform="rotate(-90 45 45)">
      <circle cx="45" cy="45" r="34" fill="none" stroke="var(--accent)" stroke-width="13" stroke-dasharray="${caja.toFixed(1)} ${C}"/>
      <circle cx="45" cy="45" r="34" fill="none" stroke="var(--warn)" stroke-width="13" stroke-dasharray="${pal.toFixed(1)} ${C}" stroke-dashoffset="${(-caja).toFixed(1)}"/>
    </g>
    <text x="45" y="42" text-anchor="middle" fill="var(--ink)" font-size="16" font-weight="800">${fmt(pc,0)}%</text>
    <text x="45" y="55" text-anchor="middle" fill="var(--muted)" font-size="9" font-weight="700">Caja</text>
  </svg>`;
}
function renderMix(){
  const rows=filtered();
  const cajas=rows.reduce((sum,row)=>sum+row.cajas,0);
  const sueltas=rows.reduce((sum,row)=>sum+row.cajas_sueltas,0);
  const pallet=Math.max(cajas-sueltas,0), total=sueltas+pallet;
  const pc=total?sueltas/total*100:0, pp=total?pallet/total*100:0;
  const per=document.getElementById("mix-per"); if(per) per.textContent=selectedPeriodLabel();
  document.getElementById("mix").innerHTML=`
    <div class="perfil-donut">
      ${donutMix(pc)}
      <div class="perfil-leg">
        <div class="lg"><span class="d" style="background:var(--accent)"></span><span class="n">Caja</span><span class="v">${fmt(pc,1)}%</span></div>
        <div class="lg"><span class="d" style="background:var(--warn)"></span><span class="n">Pallet</span><span class="v">${fmt(pp,1)}%</span></div>
      </div>
    </div>`;
}
// participacion por familia (% de cajas sueltas) — fijo
function renderFamilia(){
  const dia=state.period==="dia"?state.dia:"__ALL__";
  const grupos=new Map();
  FAMILIAS.filter(row=>monthOf(row)===state.mes
    && row.familia!=="(SIN FAMILIA)"   // se oculta: dato sin clasificar en W4W (~0.1%); se excluye tambien del total
    && (dia==="__ALL__"||row.dia===dia)
    && (state.turno==="__ALL__"||row.turno===state.turno))
    .forEach(row=>{
      const value=grupos.get(row.familia)||{familia:row.familia,cajas_sueltas:0,cajas:0};
      value.cajas_sueltas+=row.cajas_sueltas;
      value.cajas+=row.cajas;
      grupos.set(row.familia,value);
    });
  const total=[...grupos.values()].reduce((sum,row)=>sum+row.cajas_sueltas,0);
  const fam=[...grupos.values()].map(row=>({...row,pct:total?row.cajas_sueltas/total*100:0}))
    .sort((a,b)=>b.cajas_sueltas-a.cajas_sueltas);
  if(!fam.length){document.getElementById("familia").innerHTML=`<div class="hint" style="padding:8px 0">Sin datos de familia</div>`;return;}
  const FAM_COLORS=["#1f6feb","#2da44e","#8250df","#d4a72c","#1aa3c2","#bc4c00"];
  document.getElementById("familia").innerHTML=`<div class="famlist">`+fam.map((f,i)=>{
    const c=FAM_COLORS[i%6];
    return `<div class="frow"><span class="fdot" style="background:${c}"></span><span class="fnm" title="${f.familia}">${f.familia}</span><span class="fpc" style="color:${c}">${fmt(f.pct,1)}%</span></div>`;
  }).join("")+`</div>`;
}
const MESES_ABBR=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];
// --- mes actual vs mes anterior (comparacion) ---
const monthOf = c => (c.dia||"").slice(0,7);
function mesLabel(ym){ if(!ym) return ""; const [y,mo]=ym.split("-"); return `${MESES_ABBR[(+mo)-1]}-${y.slice(2)}`; }
function selectedPeriodLabel(){
  return state.period==="dia"&&state.dia!=="__ALL__" ? state.dia.split("-").reverse().join("/") : mesLabel(state.mes);
}
function rebuildFromData(){
  const source=HISTORICAL?.celdas?.length?HISTORICAL:DATA;
  CELLS = normalizeCells(source);
  FAMILIAS = normalizeFamilias(source);
  if(!FAMILIAS.length&&source!==DATA) FAMILIAS=normalizeFamilias(DATA);
  OBJETIVOS = normalizeObjetivos(source);
  if(!OBJETIVOS.length&&source!==DATA) OBJETIVOS=normalizeObjetivos(DATA);
  MONTHS = [...new Set(CELLS.map(monthOf).filter(Boolean))].sort();
  LATEST_M = MONTHS[MONTHS.length-1] || "";
  if(!state.mes||!MONTHS.includes(state.mes)) state.mes=LATEST_M;
  CUR_M = state.mes;
  const currentIndex=MONTHS.indexOf(CUR_M);
  PREV_M = currentIndex>0 ? MONTHS[currentIndex-1] : null;
  CUR = CELLS.filter(c=>monthOf(c)===CUR_M);           // mes en curso
  PREV = PREV_M ? CELLS.filter(c=>monthOf(c)===PREV_M) : [];  // mes anterior (si existe)
  PERIODO_LABEL = mesLabel(CUR_M);
}
// badge de variacion vs mes anterior (↑ verde / ↓ rojo); vacio si no hay mes anterior
function deltaBadge(cur, prev){
  if(!PREV.length || !prev) return "";
  const d=(cur-prev)/prev*100, up=d>=0, cls=Math.abs(d)<0.1?"flat":(up?"up":"down");
  return `<span class="delta ${cls}">${up?"▲":"▼"} ${fmt(Math.abs(d),1)}%</span>`;
}
// Catmull-Rom -> Bezier: convierte una lista de puntos en una curva suave (sin esquinas)
function smoothPath(pts, t=0.18){
  if(pts.length<2) return "";
  if(pts.length===2) return `M${pts[0][0]},${pts[0][1]} L${pts[1][0]},${pts[1][1]}`;
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])*t, c1y=p1[1]+(p2[1]-p0[1])*t;
    const c2x=p2[0]-(p3[0]-p1[0])*t, c2y=p2[1]-(p3[1]-p1[1])*t;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function kfmt(v){v=+v||0; return v>=1000?(v/1000).toLocaleString("es-PE",{maximumFractionDigits:0})+"k":v.toLocaleString("es-PE",{maximumFractionDigits:0});}
// Combo: BARRAS = productividad (tasa/h) con colores de semaforo · LINEA = total del dia (volumen).
function comboChart(svg, days, m, target){
  // viewBox con la proporcion REAL de la tarjeta -> escala uniforme y texto NITIDO (antes se estiraba y salia borroso)
  const W=1000, box=svg.getBoundingClientRect();
  const H=(box.width>0&&box.height>0)?Math.max(260,Math.round(W*box.height/box.width)):600;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const L=64,R=72,T=40,B=84,pw=W-L-R,ph=H-T-B;
  const n=days.length||1;
  // escala ajustada: barras protagonistas -> tope FINO sobre P95 con poco margen (antes saltaba a 1/2/5x10^n y dejaba las barras a media altura)
  const niceCeil=v=>{if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),step=e/5;return Math.ceil(v/step)*step;};
  const okRates=days.filter(d=>d.rate!=null&&!d.partial).map(d=>d.rate).sort((a,b)=>a-b);
  const p95=okRates.length?okRates[Math.min(okRates.length-1,Math.floor(okRates.length*0.95))]:0;
  const maxRate=niceCeil(Math.max(p95,(target?.objetivo||0)*1.1,1)*1.06);
  const maxTot=Math.max(...days.filter(d=>!d.partial).map(d=>d.total),1);
  const slot=pw/n, bw=Math.min(slot*0.66,50);
  const xC=i=>L+slot*i+slot/2;
  const uni=m.unit.replace("/h","");
  const totalLabel={unidades_productivas:"T.Unds",volumen_m3:"T.m³",peso_tn:"T.Tn",ubicaciones:"T.Ubic",tareas:"T.Tareas"}[m.key]||`T.${uni}`;
  let o=`<rect width="${W}" height="${H}" fill="transparent"/>`;
  // grilla + eje izq (tasa, tinta -> barras) + eje der (total, azul -> linea)
  for(let i=0;i<=4;i++){const y=T+ph*i/4;
    o+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--chart-grid)"/>`;
    o+=`<text x="${L-10}" y="${y+5}" text-anchor="end" font-size="16" fill="var(--ink)" font-weight="800">${fmt(maxRate*(1-i/4),m.dec)}</text>`;
    o+=`<text x="${W-R+10}" y="${y+5}" text-anchor="start" font-size="16" fill="var(--accent)" font-weight="800">${kfmt(maxTot*(1-i/4))}</text>`;}
  if(!days.some(d=>d.total||d.rate!=null)){o+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="18">Sin datos</text>`;svg.innerHTML=o;return;}
  // barras = productividad (tasa) coloreadas por semaforo; valor VERTICAL en la base (blanco con halo oscuro -> legible siempre)
  days.forEach((d,i)=>{const x=xC(i)-bw/2, yBase=T+ph;
    if(d.rate!=null&&!d.partial){const clipped=d.rate>maxRate, h=Math.min(ph,ph*(d.rate/maxRate)), yTop=T+ph-h;
      const st=semaforo(d.rate,target,true), col=semaforoColor(st);
      o+=`<rect x="${x}" y="${yTop}" width="${bw}" height="${Math.max(0,h)}" rx="2" fill="${col}" opacity=".92"><title>${d.label}: ${fmt(d.rate,m.dec)} ${m.unit} · ${st.label}</title></rect>`;
      if(clipped)o+=`<text x="${xC(i)}" y="${yTop-3}" text-anchor="middle" font-size="13" font-weight="800" fill="${col}">▲</text>`;
      if(d.rate>0){const ty=yBase-8;
        o+=`<text x="${xC(i)}" y="${ty}" text-anchor="start" dominant-baseline="central" font-size="17.5" font-weight="800" fill="#fff" stroke="rgba(8,12,22,.92)" stroke-width="3.6" paint-order="stroke" stroke-linejoin="round" transform="rotate(-90 ${xC(i)} ${ty})">${fmt(d.rate,m.dec)}</text>`;}}
    else if(d.partial){o+=`<text x="${xC(i)}" y="${yBase-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">parcial</text>`;}
    o+=`<text x="${xC(i)}" y="${yBase+10}" text-anchor="end" font-size="16.5" font-weight="800" fill="var(--ink)" stroke="var(--panel)" stroke-width="3" paint-order="stroke" stroke-linejoin="round" transform="rotate(-90 ${xC(i)} ${yBase+10})">${d.label}</text>`;});
  // objetivo (linea punteada sobre la escala de tasa, igual que las barras)
  if(target?.objetivo){
    const goalY=T+ph-(target.objetivo/maxRate)*ph;
    o+=`<line x1="${L}" y1="${goalY}" x2="${W-R}" y2="${goalY}" stroke="var(--goal)" stroke-width="2.8" stroke-dasharray="10 6" opacity="1"/>`;
  }
  // linea = total del dia (volumen) con valores (halo del color del panel para que no los tape la linea)
  const yT=v=>T+ph-(v/maxTot)*ph;
  const pts=days.map((d,i)=>(d.rate==null||d.partial)?null:[xC(i),yT(d.total),d]).filter(Boolean);
  if(pts.length>1)o+=`<path d="${smoothPath(pts)}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p)=>{o+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"><title>${p[2].label}: ${fmt(p[2].total,0)} ${uni}</title></circle>`;});
  pts.forEach((p,i)=>{if(n<=18||i%2===0)o+=`<text x="${p[0]}" y="${p[1]-13}" text-anchor="middle" font-size="16" fill="var(--accent)" font-weight="800" stroke="var(--panel)" stroke-width="3.8" paint-order="stroke" stroke-linejoin="round">${kfmt(p[2].total)}</text>`;});
  // leyenda arriba-derecha
  const lx=W-R-370, ly=9;
  o+=`<rect x="${lx}" y="${ly-8}" width="16" height="16" rx="3" fill="var(--accent-2)"/><text x="${lx+22}" y="${ly+5}" font-size="13" fill="var(--ink)" font-weight="800">${m.label}</text>`;
  o+=`<line x1="${lx+108}" y1="${ly}" x2="${lx+136}" y2="${ly}" stroke="var(--accent)" stroke-width="3"/><circle cx="${lx+122}" cy="${ly}" r="4" fill="var(--accent)"/><text x="${lx+143}" y="${ly+5}" font-size="13" fill="var(--ink)" font-weight="800">${totalLabel}</text>`;
  if(target?.objetivo)o+=`<line x1="${lx+228}" y1="${ly}" x2="${lx+257}" y2="${ly}" stroke="var(--goal)" stroke-width="2.8" stroke-dasharray="7 5" opacity="1"/><text x="${lx+264}" y="${ly+5}" font-size="13" fill="var(--ink)" font-weight="800">Obj</text>`;
  svg.innerHTML=o;
}
function renderTrend(){
  const m=metricDef();
  const base=trendFiltered();
  const g=groupBy(base,"dia");
  const keys=[...g.keys()].sort();
  const target=targetFor(m.key);
  document.getElementById("trend-title").textContent=`Tendencia diaria · ${m.label}`;
  if(!keys.length){comboChart(document.getElementById("trend"),[],m,target);return;}
  const mm=keys[keys.length-1].split("-")[1], mesAb=MESES_ABBR[(+mm)-1];
  const maxDay=Math.max(...keys.map(k=>+k.split("-")[2]));
  const byDay={}; keys.forEach(k=>byDay[+k.split("-")[2]]=g.get(k));
  const MINH=4; // dia con < 4 h trabajadas = parcial / tasa poco fiable (ej. dia en curso)
  const days=[];
  for(let d=1;d<=maxDay;d++){
    const rows=byDay[d];
    days.push(rows
      ? (()=>{const horas=rows.reduce((a,r)=>a+r.horas,0);return {label:`${d}-${mesAb}`, total:rows.reduce((a,r)=>a+r[m.num],0), rate:rateOf(rows,m), horas, partial:horas<MINH};})()
      : {label:`${d}-${mesAb}`, total:0, rate:null, horas:0, partial:false});
  }
  comboChart(document.getElementById("trend"),days,m,target);
}
// Usuarios de un conjunto de celdas (una tarjeta de turno), con su tasa por metrica.
function usersFrom(rows){
  const g=groupBy(rows,"usuario"), out=[];
  for(const[u,rs]of g){
    const o={usuario:u, turno:rs[0].turno, horas:rs.reduce((a,r)=>a+r.horas,0),
             peso_tn:rs.reduce((a,r)=>a+r.peso_tn,0)};
    for(const m of METRICS)o[m.key]=rateOf(rs,m);
    o.efic=rateOf(rs,EFIC);
    out.push(o);
  }
  return out;
}
// datos del ranking segun el modo (auto=turno por hora / manual / top 15)
function rankData(){
  const m=metricDef();
  const base=filtered();
  if(state.rankMode==="top15"){
    const users=usersFrom(base).sort((a,b)=>b[m.key]-a[m.key]).slice(0,15);
    return {titulo:"Top 15 general", sub:`Los 15 más productivos · ${m.label}`,
            tn:base.reduce((a,r)=>a+r.peso_tn,0), users, m};
  }
  const t=state.turno!=="__ALL__"?state.turno:(state.rankMode==="auto"?turnoActual():state.rankMode);
  const rows=base.filter(r=>r.turno===t);
  const users=usersFrom(rows).sort((a,b)=>b.horas-a.horas);   // vistas por turno: orden por HORAS (no por productividad)
  const sub=`${state.rankMode==="auto"?"Turno activo · ":""}${TURNO_HORARIO[t]||""} · ${users.length} oper.`;
  return {titulo:t, sub, tn:rows.reduce((a,r)=>a+r.peso_tn,0), users, m, byHoras:true};
}
function renderRanking(){
  const {titulo,sub,tn,users,m,byHoras}=rankData();
  document.getElementById("rank-turno").textContent=titulo;
  document.getElementById("rank-sub").textContent=sub;
  document.getElementById("rank-tn").textContent=fmt(tn,1);
  const list=document.getElementById("rank-list");
  if(!users.length){list.innerHTML=`<div class="empty">Iniciando turno · aún sin tareas registradas</div>`;return;}
  const max=Math.max(...users.map(u=>byHoras?u.horas:u[m.key]),1);
  const target=targetFor(m.key);
  list.innerHTML=`<div class="ranklist">`+users.map((u,i)=>{
    const barVal=byHoras?u.horas:u[m.key];
    return `
    <div class="rankrow status-${semaforo(u[m.key],target).key}"><div class="rk">${i+1}</div>
      <div class="mid"><div class="nm2" title="${u.usuario}">${u.usuario}</div>
        <div class="track"><div class="fill" style="width:${Math.max(2,(barVal/max)*100)}%"></div></div></div>
      <div class="vv" title="Eficiencia ${fmt(u.efic,0)}%">${fmt(u[m.key],m.dec)}</div>
      <div class="hh${byHoras?' strong':''}">${fmt(u.horas,1)} h</div></div>`;}).join("")+`</div>`;
}
function renderRankCtrl(){
  const opts=[["auto","Auto"],["1° TURNO","1°"],["2° TURNO","2°"],["3° TURNO","3°"],["top15","Top 15"]];
  const el=document.getElementById("rank-ctrl");
  el.innerHTML=opts.map(([k,l])=>`<button data-k="${k}" class="${state.rankMode===k?'on':''}">${l}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;state.rankMode=b.dataset.k;renderTurnoMini();renderRanking();renderRankCtrl();};
}
function renderAll(){renderKpis();renderTurnoMini();renderTrend();renderMix();renderFamilia();renderRankCtrl();renderRanking();}
// tema
const tb=document.getElementById("theme");
tb.onclick=()=>{const r=document.documentElement;const cur=r.getAttribute("data-theme");
  const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
  r.setAttribute("data-theme",next);try{localStorage.setItem("wt-theme",next);}catch(e){}};
try{const s=localStorage.getItem("wt-theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}
async function loadData(){
  try{
    const res = await fetch("./dash_data.json?ts="+Date.now(), {cache:"no-store"});
    if(!res.ok) return;
    const next = await res.json();
    if(!next || !Array.isArray(next.celdas)) return;
    DATA = next;
    rebuildFromData();
    renderFilters();
    renderAll();
  }catch(e){
    // Mantiene el ultimo DATA valido, incluido el snapshot embebido.
  }
}
async function loadHistorical(){
  try{
    const res=await fetch("./historico_data.json?ts="+Date.now(),{cache:"no-store"});
    if(!res.ok)return;
    const next=await res.json();
    if(!next||!Array.isArray(next.celdas)||!next.celdas.length)return;
    HISTORICAL=next;
    rebuildFromData();
    renderFilters();
    renderAll();
  }catch(e){
    // Mantiene la vista mensual si el archivo histórico aún no fue publicado.
  }
}
rebuildFromData();
renderControls();renderPeriod();renderFilters();renderAll();
loadData();loadHistorical();
setInterval(loadData, 5*60*1000);
setInterval(loadHistorical, 10*60*1000);
// en modo Auto, revisa cada minuto si cambio el turno por la hora (Lima) y re-renderiza
let _turnoPrev=turnoActual();
setInterval(()=>{
  if(state.rankMode!=="auto") return;
  const t=turnoActual();
  if(t!==_turnoPrev){ _turnoPrev=t; renderTurnoMini(); renderRanking(); }
}, 60000);
</script>
